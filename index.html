<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Marruá Empório</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* PALETA: Verde Musgo Escuro, Verde Claro e Branco */
      --moss-deep: #0a140d;         /* Fundo geral super escuro */
      --moss-dark: #102115;         /* Verde musgo escuro base */
      --moss-card: #15291b;         /* Fundo dos cartões e caixas */
      --moss-card-hover: #1b3323;   /* Fundo no hover */
      --moss-border: #24442e;       /* Bordas em musgo */
      --moss-border-light: #325e40; /* Bordas intermediárias */
      
      --light-green: #4ade80;       /* Verde claro principal */
      --light-green-hover: #22c55e; /* Verde claro mais saturado */
      --light-green-soft: #86efac;  /* Verde claro suave */
      --light-green-glow: rgba(74, 222, 128, 0.22);
      
      --white: #ffffff;             /* Branco puro */
      --white-soft: #f1f5f9;        /* Branco suave */
      --text-muted: #94a3b8;        /* Texto secundário */
      --text-sage: #bbf7d0;         /* Texto verde claro suave */
      
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.6), 0 8px 10px -6px rgba(0,0,0,0.5);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--moss-deep);
      color: var(--white-soft);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--moss-deep);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--moss-border-light);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--light-green);
    }

    /* HEADER */
    header {
      background: linear-gradient(180deg, rgba(16, 33, 21, 0.98) 0%, rgba(10, 20, 13, 0.98) 100%);
      border-bottom: 1px solid var(--moss-border);
      padding: 26px 20px 18px;
      position: relative;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo-img {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      border: 2px solid var(--light-green);
      object-fit: cover;
      box-shadow: 0 4px 15px var(--light-green-glow);
      background: #ffffff;
      flex-shrink: 0;
      transition: var(--transition);
    }

    .brand-logo-img:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(74, 222, 128, 0.35);
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--white);
    }

    .stats-bar {
      display: flex;
      gap: 14px;
      font-size: 0.88rem;
      color: var(--text-muted);
      align-items: center;
    }

    .stat-item strong {
      color: var(--white);
    }

    .status-pill {
      background: rgba(74, 222, 128, 0.15);
      color: var(--light-green);
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* CONTROLS */
    .controls-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--moss-card);
      border: 1px solid var(--moss-border);
      color: var(--white);
      padding: 11px 16px 11px 40px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
      font-family: inherit;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-box input:focus {
      border-color: var(--light-green);
      background: var(--moss-card-hover);
      box-shadow: 0 0 0 3px var(--light-green-glow);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--light-green);
      pointer-events: none;
      font-size: 1rem;
    }

    .sort-select {
      background: var(--moss-card);
      border: 1px solid var(--moss-border);
      color: var(--white);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.92rem;
      cursor: pointer;
      outline: none;
      font-family: inherit;
      transition: var(--transition);
    }

    .sort-select:focus, .sort-select:hover {
      border-color: var(--light-green);
    }

    /* CATEGORIES BAR */
    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .cat-btn {
      background: var(--moss-card);
      border: 1px solid var(--moss-border);
      color: var(--white-soft);
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }

    .cat-btn:hover {
      border-color: var(--light-green);
      color: var(--white);
      background: var(--moss-card-hover);
    }

    .cat-btn.active {
      background: var(--light-green);
      border-color: var(--light-green);
      color: #07170b;
      font-weight: 700;
      box-shadow: 0 3px 12px var(--light-green-glow);
    }

    /* PRODUCT GRID */
    .container {
      max-width: 1400px;
      margin: 28px auto 0;
      padding: 0 20px;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
    }

    /* PRODUCT CARD */
    .card {
      background: var(--moss-card);
      border: 1px solid var(--moss-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      cursor: pointer;
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px);
      background: var(--moss-card-hover);
      border-color: var(--light-green);
      box-shadow: 0 12px 30px -6px rgba(0,0,0,0.7), 0 0 16px rgba(74, 222, 128, 0.18);
    }

    .card-thumb {
      width: 100%;
      height: 260px;
      background: #080f0a;
      position: relative;
      overflow: hidden;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card:hover .card-thumb img {
      transform: scale(1.05);
    }

    .photo-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(10, 20, 13, 0.85);
      backdrop-filter: blur(6px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--white);
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .num-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(10, 20, 13, 0.85);
      backdrop-filter: blur(6px);
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--light-green);
      border: 1px solid var(--moss-border);
    }

    .card-body {
      padding: 18px 16px 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--light-green);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 1.08rem;
      font-weight: 600;
      color: var(--white);
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .price-wrap {
      display: flex;
      flex-direction: column;
    }

    .old-price {
      font-size: 0.8rem;
      color: #f87171;
      text-decoration: line-through;
    }

    .price {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--light-green);
    }

    .view-btn {
      background: var(--moss-border);
      color: var(--white);
      border: 1px solid var(--moss-border-light);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }

    .card:hover .view-btn {
      background: var(--light-green);
      color: #07170b;
      border-color: var(--light-green);
      box-shadow: 0 2px 10px var(--light-green-glow);
    }

    /* MODAL LIGHTBOX */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(7, 14, 9, 0.88);
      backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-dialog {
      background: var(--moss-card);
      border: 1px solid var(--moss-border-light);
      border-radius: 16px;
      width: 100%;
      max-width: 960px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(74, 222, 128, 0.15);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(10, 20, 13, 0.7);
      border: 1px solid var(--moss-border);
      color: var(--white);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: var(--transition);
    }

    .modal-close:hover {
      background: #ef4444;
      border-color: #ef4444;
    }

    .modal-body {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      overflow-y: auto;
      height: 100%;
    }

    @media (max-width: 768px) {
      .modal-body {
        grid-template-columns: 1fr;
      }
    }

    /* GALLERY IN MODAL */
    .modal-gallery {
      background: #08110a;
      display: flex;
      flex-direction: column;
      padding: 18px;
      gap: 12px;
      border-right: 1px solid var(--moss-border);
    }

    .main-image-wrap {
      width: 100%;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #040805;
      border: 1px solid var(--moss-border);
    }

    .main-image-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(10, 20, 13, 0.8);
      border: 1px solid var(--moss-border-light);
      color: var(--white);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: var(--transition);
    }

    .nav-arrow:hover {
      background: var(--light-green);
      color: #07170b;
      border-color: var(--light-green);
    }

    .nav-prev { left: 12px; }
    .nav-next { right: 12px; }

    .thumbnails-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
    }

    .thumb-item {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0.55;
      transition: var(--transition);
      background: #000;
    }

    .thumb-item.active, .thumb-item:hover {
      border-color: var(--light-green);
      opacity: 1;
      transform: scale(1.03);
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* MODAL INFO */
    .modal-info {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-cat {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--light-green);
      font-weight: 700;
    }

    .modal-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--white);
      line-height: 1.3;
    }

    .modal-price-box {
      background: var(--moss-dark);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--moss-border);
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .modal-price {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--light-green);
    }

    .modal-desc-box {
      background: var(--moss-deep);
      border: 1px solid var(--moss-border);
      border-radius: 12px;
      padding: 16px;
      color: var(--white-soft);
      font-size: 0.92rem;
      line-height: 1.6;
      max-height: 200px;
      overflow-y: auto;
    }

    .modal-meta {
      font-size: 0.84rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .modal-meta strong {
      color: var(--white);
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    /* BOTAO MINIMALISTA VOLTAR AO TOPO */
    .back-to-top {
      position: fixed;
      bottom: 26px;
      right: 26px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--moss-card);
      border: 1.5px solid var(--moss-border-light);
      color: var(--light-green);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 90;
      opacity: 0;
      visibility: hidden;
      transform: translateY(14px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px var(--light-green-glow);
    }

    .back-to-top.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .back-to-top:hover {
      background: var(--light-green);
      color: #07170b;
      border-color: var(--light-green);
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7), 0 0 20px rgba(74, 222, 128, 0.45);
    }

    .back-to-top:active {
      transform: translateY(-1px);
    }

    .back-to-top svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.5;
      stroke: currentColor;
      fill: none;
      transition: transform 0.2s ease;
    }

    .back-to-top:hover svg {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="brand-row">
        <div class="brand-title">
          <img src="logo.jpg" alt="Logo Marruá Empório" class="brand-logo-img">
          <div>
            <h1>Marruá Empório</h1>
            <div class="stats-bar">
              <span class="stat-item"><strong id="stat-products">0</strong> produtos</span>
              <span>•</span>
              <span class="stat-item"><strong id="stat-images">0</strong> fotos salvas</span>
              <span>•</span>
              <span class="status-pill">100% Offline</span>
            </div>
          </div>
        </div>

        <div class="controls-row">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Buscar por nome ou detalhe...">
          </div>
          <select id="sort-select" class="sort-select">
            <option value="num-asc">Ordem Original (#1 a #82)</option>
            <option value="price-asc">Preço: Menor para Maior</option>
            <option value="price-desc">Preço: Maior para Menor</option>
            <option value="title-asc">Nome: A - Z</option>
          </select>
        </div>
      </div>

      <div class="categories-bar" id="categories-bar">
        <button class="cat-btn active" data-category="ALL">Todos (<span id="cat-all-count">0</span>)</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="catalog-grid" id="catalog-grid"></div>
  </main>

  <!-- MODAL LIGHTBOX -->
  <div class="modal" id="product-modal">
    <div class="modal-dialog">
      <button class="modal-close" id="modal-close-btn">&times;</button>
      <div class="modal-body">
        <div class="modal-gallery">
          <div class="main-image-wrap">
            <button class="nav-arrow nav-prev" id="nav-prev">&#10094;</button>
            <img id="modal-main-img" src="" alt="">
            <button class="nav-arrow nav-next" id="nav-next">&#10095;</button>
          </div>
          <div class="thumbnails-strip" id="modal-thumbs"></div>
        </div>

        <div class="modal-info">
          <span class="modal-cat" id="modal-category"></span>
          <h2 class="modal-title" id="modal-title"></h2>

          <div class="modal-price-box">
            <span class="old-price" id="modal-old-price"></span>
            <span class="modal-price" id="modal-price"></span>
          </div>

          <div class="modal-desc-box" id="modal-desc"></div>

          <div class="modal-meta">
            <div><strong>Pasta local:</strong> <span id="modal-folder"></span></div>
            <div><strong>Fotos disponíveis:</strong> <span id="modal-photo-count"></span></div>
            <div><strong>Condição:</strong> <span id="modal-condition">Novo</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTAO MINIMALISTA VOLTAR AO TOPO -->
  <button class="back-to-top" id="back-to-top-btn" title="Voltar ao topo" aria-label="Voltar ao topo">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <!-- Carrega os dados offline de produtos.js -->
  <script charset="utf-8" src="produtos.js"></script>

  <script>
    let products = [];
    let currentCategory = 'ALL';
    let currentSearch = '';
    let currentProduct = null;
    let currentImageIndex = 0;

    function formatBRL(val) {
      if (val === null || val === undefined || isNaN(val)) return 'R$ 0,00';
      return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function initCatalog(data) {
      products = data;
      document.getElementById('stat-products').innerText = products.length;

      let totalImages = 0;
      const categoriesMap = {};

      products.forEach(p => {
        totalImages += (p.Fotos_Locais ? p.Fotos_Locais.length : 0);
        if (p.Categorias) {
          p.Categorias.split(',').forEach(c => {
            const cat = c.trim();
            if (cat) {
              categoriesMap[cat] = (categoriesMap[cat] || 0) + 1;
            }
          });
        }
      });

      document.getElementById('stat-images').innerText = totalImages;
      document.getElementById('cat-all-count').innerText = products.length;

      // Render category buttons
      const catBar = document.getElementById('categories-bar');
      Object.keys(categoriesMap).sort().forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn';
        btn.dataset.category = cat;
        btn.innerText = `${cat} (${categoriesMap[cat]})`;
        btn.onclick = () => selectCategory(cat, btn);
        catBar.appendChild(btn);
      });

      renderProducts();
    }

    function selectCategory(cat, btnElem) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btnElem.classList.add('active');
      renderProducts();
    }

    document.querySelector('.cat-btn[data-category="ALL"]').onclick = function() {
      selectCategory('ALL', this);
    };

    document.getElementById('search-input').addEventListener('input', (e) => {
      currentSearch = e.target.value.toLowerCase().trim();
      renderProducts();
    });

    document.getElementById('sort-select').addEventListener('change', () => {
      renderProducts();
    });

    function getFilteredProducts() {
      let list = products.filter(p => {
        const matchesCat = (currentCategory === 'ALL') || 
          (p.Categorias && p.Categorias.toLowerCase().includes(currentCategory.toLowerCase()));
        
        const matchesSearch = !currentSearch || 
          (p.Titulo && p.Titulo.toLowerCase().includes(currentSearch)) ||
          (p.Descricao_Completa && p.Descricao_Completa.toLowerCase().includes(currentSearch)) ||
          (p.Categorias && p.Categorias.toLowerCase().includes(currentSearch));

        return matchesCat && matchesSearch;
      });

      const sortMode = document.getElementById('sort-select').value;
      list.sort((a, b) => {
        if (sortMode === 'price-asc') return (a.Preco || 0) - (b.Preco || 0);
        if (sortMode === 'price-desc') return (b.Preco || 0) - (a.Preco || 0);
        if (sortMode === 'title-asc') return a.Titulo.localeCompare(b.Titulo);
        return a.Numero - b.Numero;
      });

      return list;
    }

    function renderProducts() {
      const grid = document.getElementById('catalog-grid');
      const list = getFilteredProducts();

      if (list.length === 0) {
        grid.innerHTML = '<div class="empty-state"><h3>Nenhum produto encontrado</h3><p>Tente buscar por outro termo ou categoria.</p></div>';
        return;
      }

      grid.innerHTML = list.map(p => {
        const thumb = (p.Fotos_Locais && p.Fotos_Locais.length > 0) ? p.Fotos_Locais[0] : (p.URL_Foto_Destaque || '');
        const fallbackUrl = p.URL_Foto_Destaque || 'https://via.placeholder.com/300x260?text=Sem+Foto';
        const photoCount = (p.Fotos_Locais ? p.Fotos_Locais.length : 0);
        const hasPromo = p.Preco_Promocional && p.Preco_Promocional < p.Preco;
        const mainPrice = hasPromo ? p.Preco_Promocional : p.Preco;

        return `
          <div class="card" onclick="openModal(${p.Numero})">
            <div class="card-thumb">
              <span class="num-badge">#${p.Numero}</span>
              <img src="${thumb}" alt="${p.Titulo}" loading="lazy" onerror="if (this.src !== '${fallbackUrl}') { this.src = '${fallbackUrl}'; }">
              <span class="photo-badge">📷 ${photoCount}</span>
            </div>
            <div class="card-body">
              <span class="card-category">${p.Categorias || 'Geral'}</span>
              <h3 class="card-title">${p.Titulo}</h3>
              <p class="card-desc">${p.Descricao_Curta || p.Descricao_Completa || ''}</p>
              <div class="card-footer">
                <div class="price-wrap">
                  ${hasPromo ? `<span class="old-price">${formatBRL(p.Preco)}</span>` : ''}
                  <span class="price">${formatBRL(mainPrice)}</span>
                </div>
                <button class="view-btn" onclick="event.stopPropagation(); openModal(${p.Numero})">Ver fotos</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal(prodNum) {
      currentProduct = products.find(p => p.Numero === prodNum);
      if (!currentProduct) return;

      currentImageIndex = 0;
      document.getElementById('modal-title').innerText = currentProduct.Titulo;
      document.getElementById('modal-category').innerText = currentProduct.Categorias || 'Produto';
      document.getElementById('modal-folder').innerText = currentProduct.Pasta_Fotos || '';
      document.getElementById('modal-photo-count').innerText = `${currentProduct.Fotos_Locais ? currentProduct.Fotos_Locais.length : 0} fotos`;
      document.getElementById('modal-condition').innerText = currentProduct.Condicao || 'Novo';

      const hasPromo = currentProduct.Preco_Promocional && currentProduct.Preco_Promocional < currentProduct.Preco;
      if (hasPromo) {
        document.getElementById('modal-old-price').innerText = formatBRL(currentProduct.Preco);
        document.getElementById('modal-old-price').style.display = 'inline';
        document.getElementById('modal-price').innerText = formatBRL(currentProduct.Preco_Promocional);
      } else {
        document.getElementById('modal-old-price').style.display = 'none';
        document.getElementById('modal-price').innerText = formatBRL(currentProduct.Preco);
      }

      const descText = currentProduct.Descricao_Completa || currentProduct.Descricao_Curta || 'Sem descrição cadastrada.';
      document.getElementById('modal-desc').innerHTML = currentProduct.Descricao_HTML || `<p>${descText}</p>`;

      renderModalGallery();
      document.getElementById('product-modal').classList.add('active');
    }

    function renderModalGallery() {
      const photos = currentProduct.Fotos_Locais || [];
      if (photos.length === 0) {
        document.getElementById('modal-main-img').src = currentProduct.URL_Foto_Destaque || '';
        document.getElementById('modal-thumbs').innerHTML = '';
        document.getElementById('nav-prev').style.display = 'none';
        document.getElementById('nav-next').style.display = 'none';
        return;
      }

      document.getElementById('nav-prev').style.display = photos.length > 1 ? 'flex' : 'none';
      document.getElementById('nav-next').style.display = photos.length > 1 ? 'flex' : 'none';

      document.getElementById('modal-main-img').src = photos[currentImageIndex];
      document.getElementById('modal-main-img').onerror = function() {
        if (currentProduct && currentProduct.URL_Foto_Destaque && this.src !== currentProduct.URL_Foto_Destaque) {
          this.src = currentProduct.URL_Foto_Destaque;
        }
      };

      const thumbsContainer = document.getElementById('modal-thumbs');
      thumbsContainer.innerHTML = photos.map((src, idx) => `
        <div class="thumb-item ${idx === currentImageIndex ? 'active' : ''}" onclick="selectModalImage(${idx})">
          <img src="${src}" alt="Foto ${idx+1}" onerror="if (currentProduct && currentProduct.URL_Foto_Destaque && this.src !== currentProduct.URL_Foto_Destaque) { this.src = currentProduct.URL_Foto_Destaque; }">
        </div>
      `).join('');
    }

    function selectModalImage(idx) {
      currentImageIndex = idx;
      renderModalGallery();
    }

    document.getElementById('nav-prev').onclick = () => {
      const photos = currentProduct.Fotos_Locais || [];
      currentImageIndex = (currentImageIndex - 1 + photos.length) % photos.length;
      renderModalGallery();
    };

    document.getElementById('nav-next').onclick = () => {
      const photos = currentProduct.Fotos_Locais || [];
      currentImageIndex = (currentImageIndex + 1) % photos.length;
      renderModalGallery();
    };

    function closeModal() {
      document.getElementById('product-modal').classList.remove('active');
    }

    document.getElementById('modal-close-btn').onclick = closeModal;
    document.getElementById('product-modal').onclick = (e) => {
      if (e.target.id === 'product-modal') closeModal();
    };

    window.addEventListener('keydown', (e) => {
      if (!document.getElementById('product-modal').classList.contains('active')) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowLeft') document.getElementById('nav-prev').click();
      if (e.key === 'ArrowRight') document.getElementById('nav-next').click();
    });

    // Botao Voltar ao Topo
    const backToTopBtn = document.getElementById('back-to-top-btn');
    if (backToTopBtn) {
      window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
          backToTopBtn.classList.add('visible');
        } else {
          backToTopBtn.classList.remove('visible');
        }
      });

      backToTopBtn.addEventListener('click', () => {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      });
    }

    // Iniciar dados
    if (window.CATALOGO_PRODUTOS) {
      initCatalog(window.CATALOGO_PRODUTOS);
    } else {
      fetch('./produtos.json')
        .then(r => r.json())
        .then(data => initCatalog(data))
        .catch(err => {
          document.getElementById('catalog-grid').innerHTML = 
            '<div class="empty-state"><h3>Carregando catálogo...</h3><p>Verifique se produtos.js ou produtos.json está presente na pasta.</p></div>';
        });
    }
  </script>
</body>
</html>
